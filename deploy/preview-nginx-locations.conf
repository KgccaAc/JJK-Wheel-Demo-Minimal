location = /preview { return 301 /preview/; }
location ^~ /preview/ {
    alias /opt/jjk-preview-web/;
    index index.html;
    try_files $uri $uri/ /preview/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /preview-api/ {
    proxy_pass http://127.0.0.1:8788/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 8m;
}
location = /preview-api/health {
    proxy_pass http://127.0.0.1:8788/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
