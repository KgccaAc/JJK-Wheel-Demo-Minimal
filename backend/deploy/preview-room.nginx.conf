# Include this file inside the existing HTTPS server block.  It deliberately uses
# a new URI prefix and loopback port, leaving legacy 8787/8790 and /preview-api untouched.
location = /preview-room-api {
    return 301 /preview-room-api/;
}

location /preview-room-api/ {
    proxy_pass http://127.0.0.1:8789/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
}
